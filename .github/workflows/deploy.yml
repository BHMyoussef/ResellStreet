# Theme deployment to Hostinger (see CLAUDE.md → Deployment).
# push to main → checks → staging (automatic) → production (waits for a required reviewer, same commit).
name: Deploy theme

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only list what would change on each server"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  checks:
    # npm run check:all needs the Local WordPress site (WP-CLI, fixtures, Stripe test mode), so it runs on the
    # developer's Mac in the pre-push hook (.githooks/pre-push). CI re-checks what it can without a site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l > /dev/null
      - name: JS syntax
        run: git ls-files -z 'assets/*.js' | xargs -0 -n1 node --check

  staging:
    needs: checks
    runs-on: ubuntu-latest
    environment: staging
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - name: Skip when staging isn't set up yet (repository variable ALLOW_NO_STAGING = true)
        id: gate
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -z "$SSH_HOST" ] && [ "${{ vars.ALLOW_NO_STAGING }}" = "true" ]; then
            echo "::warning::Staging is not configured: skipped. Production still needs a reviewer's approval."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to staging
        if: steps.gate.outputs.skip != 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          THEME_PATH: ${{ secrets.THEME_PATH }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: .github/scripts/deploy.sh

  production:
    # Same workflow run = the same commit that just passed staging. Required reviewers on the "production"
    # environment pause this job until someone approves it.
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    concurrency: { group: deploy-production, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          THEME_PATH: ${{ secrets.THEME_PATH }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: .github/scripts/deploy.sh
